name: newsroom

on:
  schedule:
    - cron: "17 */2 * * *"   # כל שעתיים
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["sitegen/**", "config/site.toml", "content/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

      - name: Newsroom run
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSROOM_MODEL: ${{ vars.NEWSROOM_MODEL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; skipping the newsroom, building the site only"
          else
            python -m newsroom.pipeline run
          fi

      - name: Commit new articles and state
        if: github.event_name != 'push'
        run: |
          git config user.name "lobby-newsroom"
          git config user.email "newsroom@users.noreply.github.com"
          git add content state
          if ! git diff --cached --quiet; then
            git commit -m "newsroom: $(date -u +'%Y-%m-%d %H:%M') run"
            git push
          fi

      - name: Build site
        run: python -m sitegen.build --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
